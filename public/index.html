<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Celeste AI — Asisten Belajar Anda</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked JS for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151f32',
                            950: '#0b0f17',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
</head>

<body class="app-shell h-[100dvh] flex overflow-hidden antialiased transition-colors duration-200">

    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-30 hidden md:hidden transition-opacity duration-200"></div>

    <!-- Main Application Wrapper -->
    <div class="flex h-full w-full max-w-[1600px] mx-auto overflow-hidden relative">

        <!-- Sidebar Drawer (Mobile Slide-Over, Fixed Desktop) -->
        <aside id="sidebar" class="app-sidebar fixed md:relative z-40 w-72 h-full bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800/80 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0 shrink-0">
            <!-- Sidebar Header -->
            <div class="app-sidebar-header p-4 border-b border-slate-200 dark:border-slate-800/80 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="app-brand-mark w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm tracking-tight shadow-xs">
                        C
                    </div>
                    <div>
                        <h2 class="text-sm font-semibold leading-none text-slate-900 dark:text-slate-100">Celeste AI</h2>
                        <span class="text-[11px] text-slate-500 dark:text-slate-400">Ruang belajar</span>
                    </div>
                </div>
                <button id="close-sidebar-mobile" aria-label="Tutup Menu" class="md:hidden text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 p-1.5 rounded-lg active:bg-slate-200 dark:active:bg-slate-800">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Reset Chat Action -->
            <div class="p-3">
                <button id="reset-chat-btn" class="app-reset w-full flex items-center justify-center gap-2 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700/60 font-medium text-xs py-2.5 px-4 rounded-lg transition-colors shadow-xs cursor-pointer active:scale-98">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Reset Obrolan
                </button>
            </div>

            <!-- Sidebar Content Widgets -->
            <div class="flex-1 overflow-y-auto custom-scrollbar px-3 py-2 space-y-3">
                <!-- Realtime Time Widget -->
                <div class="app-card p-3 rounded-xl border border-slate-200/80 dark:border-slate-800 space-y-1">
                    <div class="flex items-center justify-between text-[11px] font-medium text-slate-400 uppercase tracking-wider">
                        <span>Waktu Sistem</span>
                        <span class="text-[10px] bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-1.5 py-0.5 rounded font-mono">WIB</span>
                    </div>
                    <div id="jakarta-clock" class="text-base font-bold text-slate-800 dark:text-slate-100 tracking-tight font-mono">
                        00:00:00
                    </div>
                    <div id="jakarta-date" class="text-[11px] text-slate-500 dark:text-slate-400">
                        --
                    </div>
                </div>

                <!-- Session Information Widget -->
                <div class="app-card p-3 rounded-xl border border-slate-200/80 dark:border-slate-800 space-y-2">
                    <div class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">
                        Info Obrolan
                    </div>

                    <div class="flex items-center justify-between text-xs">
                        <span class="text-slate-500 dark:text-slate-400">Status Sesi</span>
                        <span class="inline-flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400 font-medium">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            Aktif
                        </span>
                    </div>

                    <div class="flex items-center justify-between text-xs">
                        <span class="text-slate-500 dark:text-slate-400">Total Pesan</span>
                        <span id="msg-counter" class="font-semibold text-slate-700 dark:text-slate-200">0</span>
                    </div>

                    <div class="flex items-center justify-between text-xs">
                        <span class="text-slate-500 dark:text-slate-400">Masa Simpan</span>
                        <span class="text-slate-600 dark:text-slate-300 font-medium">24 Jam</span>
                    </div>
                </div>

                <!-- Guidance / Notes -->
                <div class="app-note p-3 rounded-xl border border-slate-200/50 dark:border-slate-800/50 text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
                    <p class="text-[11px]">
                        💡 Pesan tersimpan otomatis di browser ini selama 24 jam sejak aktivitas terakhir.
                    </p>
                </div>
            </div>

            <!-- Sidebar Footer Status -->
            <div class="app-sidebar-footer p-3 border-t border-slate-200 dark:border-slate-800/80">
                <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span class="text-xs">Storage On</span>
                    </div>
                    <span class="text-[10px] text-slate-400 font-mono">v1.2.0</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="app-main flex-1 flex flex-col h-full min-w-0">

            <!-- Header Bar -->
            <header class="app-header h-14 border-b border-slate-200 dark:border-slate-800/80 px-3 sm:px-6 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2.5">
                    <button id="open-sidebar-mobile" aria-label="Buka Menu Sidebar" class="md:hidden text-slate-600 dark:text-slate-300 p-2 -ml-1 rounded-lg active:bg-slate-200/60 dark:active:bg-slate-800 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    <div class="flex items-center gap-2.5">
                        <div class="relative">
                            <div class="app-avatar w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold">
                                AI
                            </div>
                            <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 border-2 border-white dark:border-slate-900 rounded-full"></span>
                        </div>
                        <div>
                            <h1 class="app-title text-sm font-semibold text-slate-900 dark:text-slate-100 leading-tight">Celeste AI</h1>
                            <p class="text-[11px] text-slate-500 dark:text-slate-400">Siap membantu belajar Anda</p>
                        </div>
                    </div>
                </div>

                <!-- Action Controls (Model Selector Desktop & Theme Toggle) -->
                <div class="flex items-center gap-2">
                    <!-- Dropdown Pilih Model AI (Tampil Khusus Desktop sm:block) -->
                    <div class="relative hidden sm:block">
                        <select id="model-select" aria-label="Pilih Model AI" class="app-model-select bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-medium py-1.5 px-2.5 pr-7 rounded-lg border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-1 focus:ring-slate-400 dark:focus:ring-slate-500 cursor-pointer appearance-none transition-colors">
                            <option value="mimo-v2.5-pro">mimo-v2.5-pro</option>
                            <option value="deepseek-v4.1-flash">deepseek-v4.1-flash</option>
                            <option value="glm-5.3-flash">glm-5.3-flash</option>
                            <option value="kimi-k2.8">kimi-k2.8</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500 dark:text-slate-400">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </div>
                    </div>

                    <!-- Theme Toggle Button -->
                    <button id="theme-toggle" type="button" aria-label="Toggle Theme" class="p-2 rounded-lg text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        <svg id="theme-toggle-light-icon" class="hidden w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                        <svg id="theme-toggle-dark-icon" class="hidden w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Chat Messages Container -->
            <div id="chat-box" class="app-chat flex-1 overflow-y-auto custom-scrollbar p-3 sm:p-6 space-y-4">
                <!-- Messages appended dynamically -->
            </div>

            <!-- Input Form Section -->
            <div class="app-composer p-2.5 sm:p-4 border-t border-slate-200 dark:border-slate-800/80 bg-white dark:bg-slate-900">
                <form id="chat-form" class="app-composer-form max-w-4xl mx-auto flex flex-col gap-1.5 border border-slate-200 dark:border-slate-700/70 rounded-2xl p-2 transition-all">
                    
                    <!-- Textarea Input -->
                    <textarea id="user-input" rows="1" placeholder="Tulis pesan atau lampirkan foto..." class="w-full bg-transparent border-0 px-2 py-1 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none resize-none max-h-32 custom-scrollbar"></textarea>

                    <!-- Hidden Inputs untuk File Handling HP/Desktop -->
                    <input type="file" id="file-input-gallery" accept="image/*" class="hidden" />
                    <input type="file" id="file-input-camera" accept="image/*" capture="environment" class="hidden" />

                    <!-- Action Bar Toolbar -->
                    <div class="flex items-center justify-between pt-1 border-t border-slate-200/50 dark:border-slate-700/30">
                        <div class="flex items-center gap-1 max-w-[75%] sm:max-w-none">
                            <!-- Tombol Upload Galeri -->
                            <button type="button" id="btn-attach-gallery" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-lg active:bg-slate-200/60 dark:active:bg-slate-800 transition-colors cursor-pointer shrink-0" title="Pilih dari Galeri">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                            </button>

                            <!-- Tombol Ambil Foto Kamera (Muncul Khusus di Layar Mobile) -->
                            <button type="button" id="btn-attach-camera" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-lg active:bg-slate-200/60 dark:active:bg-slate-800 transition-colors cursor-pointer sm:hidden shrink-0" title="Ambil Foto dengan Kamera">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </button>

                            <!-- Dropdown Pilih Model AI (Tampil Khusus Mobile sm:hidden) -->
                            <div class="relative sm:hidden ml-1">
                                <select id="model-select-mobile" aria-label="Pilih Model AI Mobile" class="app-model-select bg-slate-200/70 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-[11px] font-medium py-1 px-2 pr-6 rounded-md border-0 focus:outline-none cursor-pointer appearance-none truncate max-w-[140px]">
                                    <option value="mimo-v2.5-pro">mimo-v2.5-pro</option>
                                    <option value="deepseek-v4.1-flash">deepseek-v4.1-flash</option>
                                    <option value="glm-5.3-flash">glm-5.3-flash</option>
                                    <option value="kimi-k2.8">kimi-k2.8</option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-1.5 text-slate-500 dark:text-slate-400">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                    </svg>
                                </div>
                            </div>

                            <span class="text-[11px] text-slate-400 hidden sm:inline ml-1">Tekan Enter untuk mengirim</span>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" id="send-btn" class="app-send p-2 rounded-xl transition-all disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer flex items-center justify-center shrink-0 active:scale-95">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
